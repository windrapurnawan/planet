<!DOCTYPE html>

<head>

    <title>Login Voucher</title> 
    <link rel="icon" href="favicon.png">

<script>
  var error = "$(error)";
  if ((error == "user $(username) has reached uptime limit") || (error ==
          "kode voucher/user $(username) sudah mencapai batas waktu")) {
      window.location.href = "./expired.html";
  }
</script>
<body>
    <section>
	        $(if chap-id)
        <form name="sendin" action="$(link-login-only)" method="post">
            <input type="hidden" name="username" />
            <input type="hidden" name="password" />
            <input type="hidden" name="dst" value="$(link-orig)" />
            <input type="hidden" name="popup" value="true" />
        </form>

        <script type="text/javascript" src="js/md5.js"></script>
        <script type="text/javascript">
            function doLogin() {
                document.sendin.username.value = document.login.username.value;
                document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value +
                    '$(chap-challenge)');
                document.sendin.submit();
                return false;
            }
        </script>
        $(endif)
      <div class="grid-container menu">
        <div class="grid-item">
      <img src="assets/img/logo.png" width="70%">
      <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
          <input type="checkbox" id="checkbox" />
          <div class="slider round">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="bi bi-moon-fill" viewBox="0 0 16 16">

          </svg>
        </label>
      </div>
    </div>
    </div>
  </div>
      <header>
          <div id="Div_Promo_Carousel" class="carousel slide" data-ride="carousel">
            <div class="carousel-inner" role="listbox">
                <div class="carousel-item active"><img class="d-block w-100" alt="Slide Image" src="./assets/img/Group3.png" /></div>
                <div class="carousel-item"><img class="d-block w-100" alt="Slide Image" src="./assets/img/Group2.png" /></div>
                <div class="carousel-item"><img class="d-block w-100" alt="Slide Image" src="./assets/img/Group.png  " /></div>
            </div>
            <div><a class="carousel-control-prev" role="button" data-slide="prev" href="#Div_Promo_Carousel"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="sr-only">Prev </span></a><a class="carousel-control-next" role="button" data-slide="next" href="#Div_Promo_Carousel"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="sr-only">Next </span></a></div>
            <ul class="carousel-indicators" role>
                <li class="active" data-slide-to="0" data-target="#Div_Promo_Carousel"></li>
                <li data-slide-to="1" data-target="#Div_Promo_Carousel"></li>
                <li data-slide-to="2" data-target="#Div_Promo_Carousel"></li>
            </ul>
        </div>
        </header>
        <center><div id="table"></div></center>
        <main>
          <form class="form" name="login" autocomplete="off" action="$(link-login-only)" method="post" $(if chap-id)
              onSubmit="return doLogin()" $(endif)>
              <input type="hidden" name="dst" value="$(link-orig)" />
              <input type="hidden" name="popup" value="true" />
              <div class="login-input">
                  <input id="username" name="username" type="text" placeholder="Masukan kode voucher" />
              </div>
              <div id="formpass" class="login-input none">
                  <input id="password" name="password" type="hidden" />
              </div>
              <button type="submit" class="btn-login">Login</button>
          </form>
          <br>
          <br>
          <div class="error">
            $(if error)
              <span class="descrip">$(error)</span>
              $(endif)
          </div>
          <div class="buttons">

            <div class="catagory-card" >

            <div class="catagory-card">
              <a href="./info.html">
                <img src="./assets/img/info.png" alt="rules" width="40%">
              <span>Info</span></a>
            </div>
          </div>
          <div class="footpage">
            <div class="footpages">
              <div class="logo-first">
              <img src="./assets/img/masjid.png" alt="bottompage" width="100%">
            </div>
          <div class="info">
            <div class="title">Mitra Resmi</div>       
            <div class="countdownr">
              <span id="countdown">
              </span> 
            </div>
                <div class="copyrigt">ADANTARA.ID</div>
            </div>
            </div>
            </div>
          <div class="bottompages">
            <div class="bottompage">
              <div class="logo-first">
                <a href="tel:+6287739768742">
              <img src="./assets/img/kontak.png" alt="bottompage" width="80%"></a>
            </div>

                  document.login.username.focus();

                    var username = document.login.username;
